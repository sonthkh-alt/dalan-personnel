<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Dạ Lan - Nhân sự & Tài chính</title>
    
    <!-- iOS PWA Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="NS Dạ Lan">
    
    <!-- Apple Touch Icon (Premium Custom SVG Icon) -->
    <link rel="apple-touch-icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><rect width='512' height='512' rx='120' fill='%23D32F2F'/><path d='M256 90c-15 0-45 40-45 90 0 35 15 50 45 50s45-15 45-50c0-50-30-90-45-90zm-90 190c0-30 25-50 90-50s90 20 90 50c0 40-20 92-90 92s-90-52-90-92z' fill='%23FFFFFF'/><circle cx='256' cy='180' r='20' fill='%23D32F2F'/><path d='M160 380h192v25H160zM120 420h272v15H120z' fill='%23FFFFFF'/></svg>">
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json">
    
    <!-- Google Fonts: Inter & Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- CSS Stylesheet -->
    <link rel="stylesheet" href="css/styles.css">
    
    <!-- Feather Icons for Beautiful iOS UI Elements -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/feather-icons/4.29.1/feather.min.js"></script>
</head>
<body>
    <!-- App Shell Container -->
    <div class="app-container">
        
        <!-- iOS Status Bar & Header Navigation -->
        <header class="ios-header">
            <div class="ios-status-bar-spacer"></div>
            <div class="ios-nav-bar">
                <div class="ios-nav-bar-left">
                    <span class="ios-date-badge" id="header-date">Thứ Tư, 20/05</span>
                </div>
                <div class="ios-nav-bar-title">Dạ Lan</div>
                <div class="ios-nav-bar-right" id="header-action-container">
                    <!-- Dynamic Header Action Button will be injected here -->
                </div>
            </div>
            <div class="ios-large-title-container">
                <h1 class="ios-large-title" id="tab-title">Tổng quan</h1>
            </div>
        </header>

        <!-- Main Content Area (Scrollable with Elastic physics) -->
        <main class="ios-content" id="main-content">
            <!-- Dynamic components will be rendered here -->
        </main>

        <!-- iOS Bottom Tab Bar Navigation (5 Tabs HIG compliant) -->
        <nav class="ios-tab-bar">
            <button class="tab-item active" data-tab="dashboard">
                <i data-feather="grid"></i>
                <span>Tổng quan</span>
            </button>
            <button class="tab-item" data-tab="directory">
                <i data-feather="users"></i>
                <span>Nhân sự</span>
            </button>
            <button class="tab-item" data-tab="orgchart">
                <i data-feather="git-pull-request"></i>
                <span>Sơ đồ</span>
            </button>
            <button class="tab-item" data-tab="finance">
                <i data-feather="trending-up"></i>
                <span>Tài chính</span>
            </button>
            <button class="tab-item" data-tab="management">
                <i data-feather="settings"></i>
                <span>Quản lý</span>
            </button>
        </nav>
    </div>

    <!-- Slide-up Bottom Sheet (Employee Detail Card / Profile) -->
    <div class="ios-bottom-sheet-overlay" id="profile-overlay">
        <div class="ios-bottom-sheet" id="profile-sheet">
            <div class="sheet-drag-handle"></div>
            <div class="sheet-header">
                <h3>Chi tiết Nhân sự</h3>
                <button class="sheet-close-btn" id="close-profile-btn"><i data-feather="x"></i></button>
            </div>
            <div class="sheet-body" id="profile-modal-body">
                <!-- Profile details will be injected here -->
            </div>
        </div>
    </div>

    <!-- Full-screen Slide-up Modal (Add/Edit Employee Form) -->
    <div class="ios-modal-overlay" id="form-overlay">
        <div class="ios-modal" id="form-modal">
            <header class="ios-modal-header">
                <button class="modal-nav-btn cancel-btn" id="cancel-form-btn">Hủy</button>
                <h2 class="modal-title" id="form-modal-title">Thêm Nhân viên</h2>
                <button class="modal-nav-btn save-btn" id="save-form-btn">Xong</button>
            </header>
            <div class="ios-modal-body" id="form-modal-body">
                <!-- Dynamic form fields will be injected here -->
            </div>
        </div>
    </div>

    <!-- Full-screen Slide-up Modal (Add/Edit Transaction Form) -->
    <div class="ios-modal-overlay" id="transaction-overlay">
        <div class="ios-modal" id="transaction-modal">
            <header class="ios-modal-header">
                <button class="modal-nav-btn cancel-btn" id="cancel-transaction-btn">Hủy</button>
                <h2 class="modal-title" id="transaction-modal-title">Ghi chép Thu Chi</h2>
                <button class="modal-nav-btn save-btn" id="save-transaction-btn">Xong</button>
            </header>
            <div class="ios-modal-body" id="transaction-modal-body">
                <!-- Transaction form will be injected here -->
            </div>
        </div>
    </div>

    <!-- Slide-up Bottom Sheet (Customer Cart Summary) -->
    <div class="ios-bottom-sheet-overlay" id="cart-overlay">
        <div class="ios-bottom-sheet" id="cart-sheet">
            <div class="sheet-drag-handle"></div>
            <div class="sheet-header">
                <h3 style="font-family:'Outfit', sans-serif; font-size:18px; font-weight:700; color:var(--text-primary); margin:0;">Giỏ Hàng Dạ Lan</h3>
                <button class="sheet-close-btn" id="close-cart-btn"><i data-feather="x"></i></button>
            </div>
            <div class="sheet-body" id="cart-modal-body" style="padding: 16px 20px;">
                <!-- Cart items and checkout form will be injected here -->
            </div>
        </div>
    </div>

    <!-- Full-screen Slide-up Modal (Staff Order Queue Panel — Kanban Kitchen) -->
    <div class="ios-modal-overlay" id="order-queue-overlay">
        <div class="ios-modal" id="order-queue-modal">
            <header class="ios-modal-header">
                <button class="modal-nav-btn cancel-btn" id="close-order-queue-btn">Đóng</button>
                <h2 class="modal-title">🍳 Bếp & Đơn hàng</h2>
                <button class="modal-nav-btn save-btn" onclick="App.refreshOrderQueue()" style="display:flex; align-items:center;"><i data-feather="rotate-cw" style="width:18px; color:var(--brand-red,#C62828);"></i></button>
            </header>
            <div id="order-queue-modal-body" style="flex:1; overflow:hidden; background-color:var(--bg-primary); display:flex; flex-direction:column;">
                <!-- Active order kanban board will be injected here -->
            </div>
        </div>
    </div>

    <!-- Dynamic Toast Notification Container -->
    <div class="ios-toast-container" id="toast-container"></div>

    <!-- Application JavaScript Files -->
    <script src="js/store.js"></script>
    <script src="js/components.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
